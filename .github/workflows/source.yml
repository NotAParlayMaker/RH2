name: source

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tree:
    name: tree matches the manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check the hash of each file
        run: sha256sum --check --quiet --strict manifests/files.sha256
      - name: check that lean/ has no other files
        run: |
          find lean -type f | LC_ALL=C sort > local.txt
          cut -c67- manifests/files.sha256 | LC_ALL=C sort > manifest.txt
          diff manifest.txt local.txt
      - name: check that the layout is final
        run: python3 scripts/restructure.py --check

  upstream:
    name: release at alpo.ge gives lean/
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: download, unpack and compare
        run: scripts/verify-source.sh "$RUNNER_TEMP/release"
