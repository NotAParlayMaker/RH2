name: source

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tree:
    name: tree matches the manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check the hash of each file
        run: sha256sum --check --quiet --strict manifests/files.sha256
      - name: check that lean/ has no other files
        run: |
          find lean -type f | LC_ALL=C sort > "$RUNNER_TEMP/local.txt"
          cut -c67- manifests/files.sha256 | LC_ALL=C sort > "$RUNNER_TEMP/manifest.txt"
          diff "$RUNNER_TEMP/manifest.txt" "$RUNNER_TEMP/local.txt"
      - name: check that the layout is final
        run: python3 scripts/restructure.py --check
      - name: undo the layout and check the release hashes
        run: |
          cp -r lean "$RUNNER_TEMP/lean"
          python3 scripts/restructure.py --undo manifests/moves.tsv "$RUNNER_TEMP/lean"
          cd "$RUNNER_TEMP"
          sha256sum --check --quiet --strict "$GITHUB_WORKSPACE/manifests/release-files.sha256"
          find lean -type f | LC_ALL=C sort > undone.txt
          cut -c67- "$GITHUB_WORKSPACE/manifests/release-files.sha256" | LC_ALL=C sort | diff - undone.txt
      - name: redo the layout and compare with lean/
        run: |
          python3 scripts/restructure.py --moves "$RUNNER_TEMP/moves.tsv" "$RUNNER_TEMP/lean"
          diff manifests/moves.tsv "$RUNNER_TEMP/moves.tsv"
          diff -r lean "$RUNNER_TEMP/lean"

  upstream:
    name: release at alpo.ge gives lean/
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: download, unpack and compare
        run: scripts/verify-source.sh "$RUNNER_TEMP/release"
