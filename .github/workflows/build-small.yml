name: build-small

# Build the statements on top of Mathlib. The full build does not fit on a standard runner. Refer to docs/BUILD.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - lean/lakefile.toml
      - lean/lake-manifest.json
      - lean/lean-toolchain
      - lean/src/Statements.lean
      - scripts/audit-proof.sh
      - scripts/audit-statements.lean
      - .github/workflows/build-small.yml

permissions:
  contents: read

concurrency:
  group: build-small-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statements:
    name: Statements audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: build and audit the statements
        run: scripts/audit-proof.sh
